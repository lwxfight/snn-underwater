# SU-YOLO Event-Based: Spiking YOLO for ground-based satellite detection
# Input: 2-channel event frame histograms (ON/OFF polarity)
# Architecture: P1/P2/P3 heads (stride 2/4/8) optimized for tiny point-source objects
# Designed for SPARK dataset with DVS event conversion via v2e

# parameters
nc: 1  # number of classes (space object)
ch: 2  # input channels (ON/OFF event histogram)
depth_multiple: 1.0  # model depth multiple
width_multiple: 1.0  # layer channel multiple

# anchors
anchors: 2

# backbone
backbone:
  [
   # conv down
   [-1, 1, SEncoder, [64, 3, 2]],  # 0-P1/2  320x320@640, 64ch  -- P1 tap

   # elan-1 block
   [-1, 1, BasicBlock1, [128, 128, 64, 1]],  # 1-P2/4  160x160@640, 128ch  -- P2 tap

   # elan-2 block
   [-1, 1, BasicBlock1, [256, 256, 128, 1]],  # 2-P3/8  80x80@640, 256ch  -- P3 tap

   # elan-2 block
   [-1, 1, BasicBlock1, [512, 512, 256, 1]],  # 3-P4/16  40x40@640, 512ch
  ]

# head - top-down FPN, no bottom-up path (no large objects in SSA domain)
head:
  [
    # elan-spp block
   [ -1, 1, TransitionBlock, [ 512, 256 ] ],  # 4  40x40, 512ch

    # --- P3 branch (stride 8, 80x80@640) ---
    # up-concat merge with backbone P3
   [ -1, 1, SUpsample, [ 2 ] ],               # 5  80x80, 512ch
   [ [ -1, 2 ], 1, SConcat, [ 1 ] ],          # 6  80x80, 768ch (512+256)
   [ -1, 1, BasicBlock2, [ 256, 256, 128, 1 ] ],  # 7  80x80, 256ch  (P3 head)

    # --- P2 branch (stride 4, 160x160@640) ---
    # up-concat merge with backbone P2
   [ -1, 1, SUpsample, [ 2 ] ],               # 8  160x160, 256ch
   [ [ -1, 1 ], 1, SConcat, [ 1 ] ],          # 9  160x160, 384ch (256+128)
   [ -1, 1, SConv, [ 64, 1, 1 ] ],            # 10 160x160, 64ch  (channel reduction)
   [ -1, 1, BasicBlock2, [ 64, 64, 32, 1 ] ], # 11 160x160, 64ch  (P2 head)

    # --- P1 branch (stride 2, 320x320@640) ---
    # up-concat merge with backbone P1 (SEncoder output)
   [ -1, 1, SUpsample, [ 2 ] ],               # 12 320x320, 64ch
   [ [ -1, 0 ], 1, SConcat, [ 1 ] ],          # 13 320x320, 128ch (64+64)
   [ -1, 1, SConv, [ 32, 1, 1 ] ],            # 14 320x320, 32ch  (channel reduction)
   [ -1, 1, BasicBlock2, [ 32, 32, 16, 1 ] ], # 15 320x320, 32ch  (P1 head)

    # --- detect (P1, P2, P3) ---
   [ [ 15, 11, 7 ], 1, SDDetect, [ nc ] ],    # 16 detect [32, 64, 256]ch

  ]
